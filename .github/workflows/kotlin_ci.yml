# This workflow will build an aar file from rust project

name: Kotlin CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:

#  test:
#    runs-on: ubuntu-latest
#    steps:
#      - uses: actions/checkout@v4

  android:
    runs-on: macos-latest
#    needs: ['test']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          targets: aarch64-linux-android, arm-linux-androideabi, armv7-linux-androideabi, i686-linux-android, thumbv7neon-linux-androideabi, x86_64-linux-android

      - name: Install Cargo-NDK
        run: cargo install cargo-ndk

      - name: Install Android ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Generate Kotlin Code From Rust
        run: cargo pkg transact kotlin

      - name: Build AAR
        run: ./gradlew :transact:assembleRelease
        working-directory: packages/android/algokit_transact

      - name: Archive Build Output
        uses: actions/upload-artifact@v4
        with:
          name: AlgoKitTransact.aar
          path: packages/android/algokit_transact/transact/build/outputs/aar/transact-release.aar
